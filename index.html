
<div id="jarvis-universe">
  <div class="ju-header">
    <div>
      <div class="ju-logo">J.A.R.V.I.S.</div>
      <div class="ju-sub">NEURAL PARTICLE INTERFACE</div>
    </div>
    <div id="ju-status">SYSTEM STANDBY</div>
  </div>

  <div id="ju-stage">
    <canvas id="ju-world"></canvas>
    <video id="ju-camera" autoplay muted playsinline></video>
    <div class="ju-crosshair"></div>
    <div class="ju-info">
      <span id="ju-hands">HANDS: 0</span>
      <span id="ju-particles">PARTICLES: 1,000,000</span>
      <span id="ju-gesture">GESTURE: WAITING</span>
    </div>
    <div id="ju-center">JARVIS NEURAL CORE</div>
  </div>

  <div class="ju-actions">
    <button id="ju-start">CAMERA CONNECT</button>
    <button id="ju-stop">DISCONNECT</button>
    <button id="ju-mode">ENERGY MODE</button>
    <button id="ju-full">FULLSCREEN</button>
  </div>

  <div class="ju-controls">
    <label>PARTICLE POWER <input id="ju-power" type="range" min="0.3" max="3" step=".1" value="1"></label>
    <label>ZOOM <input id="ju-zoom" type="range" min=".5" max="2.5" step=".1" value="1"></label>
  </div>
  <div id="ju-message">Waiting for neural connection.</div>
</div>

<style>
#jarvis-universe{
 background:#020409;color:#d8fbff;
 border:1px solid #1c6474;border-radius:15px;
 padding:14px;font-family:Arial,sans-serif;
 max-width:1200px;margin:20px auto;
 box-shadow:0 0 40px #00d9ff12;
}
#jarvis-universe *{box-sizing:border-box}
.ju-header{display:flex;justify-content:space-between;align-items:center;padding:8px 5px 15px}
.ju-logo{font-size:25px;font-weight:bold;letter-spacing:6px;color:#55efff;text-shadow:0 0 15px #00dfff}
.ju-sub{font-size:9px;letter-spacing:3px;color:#638e9c;margin-top:5px}
#ju-status{font:11px monospace;color:#58f5ff}
#ju-stage{
 height:600px;max-height:75vh;min-height:350px;
 background:#000;position:relative;overflow:hidden;
 border:1px solid #15566a;border-radius:9px;
}
#ju-world{width:100%;height:100%;display:block}
#ju-camera{display:none}
.ju-crosshair{
 position:absolute;left:50%;top:50%;
 width:150px;height:150px;border:1px solid #36dfff22;
 border-radius:50%;transform:translate(-50%,-50%);
 pointer-events:none;
}
.ju-crosshair:before,.ju-crosshair:after{
 content:"";position:absolute;background:#36dfff35;
}
.ju-crosshair:before{width:1px;height:180px;left:50%;top:-15px}
.ju-crosshair:after{height:1px;width:180px;top:50%;left:-15px}
.ju-info{
 position:absolute;left:15px;right:15px;top:13px;
 display:flex;justify-content:space-between;gap:10px;
 font:10px monospace;color:#55eaff;
 pointer-events:none;
}
#ju-center{
 position:absolute;bottom:18px;left:50%;
 transform:translateX(-50%);
 color:#5bdef1;font:10px monospace;
 letter-spacing:3px;opacity:.6;
 pointer-events:none;white-space:nowrap;
}
.ju-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
#jarvis-universe button{
 background:#061923;color:#5cecff;
 border:1px solid #267d8e;padding:11px 15px;
 border-radius:6px;cursor:pointer;font-weight:bold;
}
#jarvis-universe button:hover{background:#0b3441}
.ju-controls{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ju-controls label{font-size:11px;color:#80b9c7}
.ju-controls input{width:100%;accent-color:#39eaff}
#ju-message{text-align:center;color:#6e9da9;font:11px monospace;padding:14px}
@media(max-width:600px){
 #ju-stage{height:450px}
 .ju-info{font-size:8px}
 .ju-controls{grid-template-columns:1fr}
}
</style>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
import {
 FilesetResolver,HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

(()=>{
const $=id=>document.getElementById("ju-"+id);
const stage=$("stage"),video=$("camera");
const COUNT=1000000;

let renderer,scene,camera,cloud,geometry,material;
let tracker=null,stream=null,running=false;
let handX=0,handY=0,targetX=0,targetY=0;
let spread=1,targetSpread=1;
let rotation=0,targetRotation=0;
let power=1,zoom=1,mode=0;
let gesture="WAITING",lastGesture="";
let lastVideoTime=-1,frame=0;

const positions=new Float32Array(COUNT*3);
const colors=new Float32Array(COUNT*3);
const sizes=new Float32Array(COUNT);

function randomSphere(){
 const u=Math.random()*2-1;
 const a=Math.random()*Math.PI*2;
 const r=100*Math.cbrt(Math.random());
 return [
  r*Math.sqrt(1-u*u)*Math.cos(a),
  r*u,
  r*Math.sqrt(1-u*u)*Math.sin(a)
 ];
}

function init3D(){
 scene=new THREE.Scene();
 camera=new THREE.PerspectiveCamera(55,1,.1,1000);
 camera.position.z=260;

 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setClearColor(0x000000,1);
 stage.insertBefore(renderer.domElement,stage.firstChild);
 renderer.domElement.id="ju-renderer";
 renderer.domElement.style.cssText="position:absolute;inset:0;width:100%;height:100%;";
 $("world").style.display="none";

 geometry=new THREE.BufferGeometry();
 for(let i=0;i<COUNT;i++){
  const p=randomSphere();
  positions[i*3]=p[0];
  positions[i*3+1]=p[1];
  positions[i*3+2]=p[2];
  sizes[i]=Math.random();
  const c=new THREE.Color();
  c.setHSL(.51+Math.random()*.06,.9,.45+Math.random()*.35);
  colors[i*3]=c.r;
  colors[i*3+1]=c.g;
  colors[i*3+2]=c.b;
 }
 geometry.setAttribute("position",new THREE.BufferAttribute(positions,3));
 geometry.setAttribute("color",new THREE.BufferAttribute(colors,3));

 material=new THREE.PointsMaterial({
  size:1.3,vertexColors:true,transparent:true,
  opacity:.95,blending:THREE.AdditiveBlending,
  depthWrite:false,sizeAttenuation:true
 });

 cloud=new THREE.Points(geometry,material);
 scene.add(cloud);

 const resize=()=>{
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
 };
 new ResizeObserver(resize).observe(stage);
 resize();
 animate();
}

function animate(){
 requestAnimationFrame(animate);
 if(!renderer)return;
 frame++;

 handX+=(targetX-handX)*.07;
 handY+=(targetY-handY)*.07;
 spread+=(targetSpread-spread)*.06;
 rotation+=(targetRotation-rotation)*.05;

 cloud.rotation.y=rotation;
 cloud.rotation.x=handY*.25;
 cloud.scale.setScalar(spread*power);
 camera.position.z=260/zoom;

 material.size=1.15+Math.sin(frame*.02)*.2;

 renderer.render(scene,camera);
}

function getGesture(p){
 const up=[];
 for(const [tip,joint] of [[8,6],[12,10],[16,14],[20,18]]){
  up.push(p[tip].y<p[joint].y);
 }
 const thumb=p[4].y<p[3].y;
 const n=up.filter(Boolean).length+(thumb?1:0);
 const pinch=Math.hypot(p[4].x-p[8].x,p[4].y-p[8].y)<.055;
 if(pinch)return "PINCH";
 if(n>=4)return "OPEN HAND";
 if(n===0)return "FIST";
 if(thumb&&n<=2)return "THUMBS UP";
 return "HAND TRACKING";
}

function processHands(result){
 const hands=result.landmarks||[];
 $("hands").textContent="HANDS: "+hands.length;

 if(!hands.length){
  $("gesture").textContent="GESTURE: WAITING";
  targetSpread=1;
  return;
 }

 const p=hands[0];
 const g=getGesture(p);

 // Invert horizontal movement: move hand right -> particle world left.
 targetX=(.5-p[9].x)*2.8;
 targetY=(.5-p[9].y)*1.8;
 targetRotation=(p[5].x-p[17].x)*2.5;

 if(g==="OPEN HAND")targetSpread=1.8;
 else if(g==="FIST")targetSpread=.45;
 else if(g==="PINCH")targetSpread=.7;
 else targetSpread=1;

 if(g!==lastGesture){
  lastGesture=g;
  $("message").textContent="GESTURE DETECTED: "+g;
  if(g==="THUMBS UP")mode=(mode+1)%3;
 }
 $("gesture").textContent="GESTURE: "+g;

 if(hands.length>1){
  const other=hands[1];
  const d=Math.hypot(p[9].x-other[9].x,p[9].y-other[9].y);
  targetSpread=THREE.MathUtils.clamp(.4+d*3,.5,2.3);
 }
}

async function start(){
 try{
  $("start").disabled=true;
  $("status").textContent="REQUESTING CAMERA...";
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{facingMode:"user",width:1280,height:720}
  });
  video.srcObject=stream;
  await video.play();

  $("status").textContent="LOADING HAND AI...";
  const vision=await FilesetResolver.forVisionTasks(
   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  tracker=await HandLandmarker.createFromOptions(vision,{
   baseOptions:{
    modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    delegate:"GPU"
   },
   runningMode:"VIDEO",numHands:2
  });

  running=true;
  $("status").textContent="NEURAL INTERFACE ONLINE";
  $("stop").disabled=false;
  loop();
 }catch(e){
  $("status").textContent="ERROR: "+e.message;
  $("start").disabled=false;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
}

function loop(){
 if(!running)return;
 if(video.readyState>=2&&video.currentTime!==lastVideoTime){
  lastVideoTime=video.currentTime;
  processHands(tracker.detectForVideo(video,performance.now()));
 }
 requestAnimationFrame(loop);
}

function stop(){
 running=false;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 video.srcObject=null;
 if(tracker){tracker.close();tracker=null;}
 targetSpread=1;targetX=0;targetY=0;
 $("status").textContent="SYSTEM STANDBY";
 $("gesture").textContent="GESTURE: WAITING";
 $("hands").textContent="HANDS: 0";
 $("start").disabled=false;
 $("stop").disabled=true;
}

$("start").addEventListener("click",start);
$("stop").addEventListener("click",stop);
$("power").addEventListener("input",e=>power=Number(e.target.value));
$("zoom").addEventListener("input",e=>zoom=Number(e.target.value));
$("mode").addEventListener("click",()=>{
 mode=(mode+1)%3;
 const palettes=[
  [0.51,.9,.55],
  [.32,.95,.5],
  [.78,.9,.55]
 ];
 const [h,s,l]=palettes[mode];
 for(let i=0;i<COUNT;i++){
  const c=new THREE.Color().setHSL(h+Math.random()*.04,s,l+Math.random()*.25);
  colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
 }
 geometry.attributes.color.needsUpdate=true;
 $("message").textContent="ENERGY MODE "+(mode+1);
});
$("full").addEventListener("click",async()=>{
 if(!document.fullscreenElement)await stage.requestFullscreen();
 else await document.exitFullscreen();
});

init3D();
})();
</script>
