
<html>
<body style="background:#222">

<div id="p" style="background:lime;width:50px;height:50px;position:absolute;left:100px;top:100px"></div>

<script>
let x=100, y=100;
onkeydown = e => {
  if(e.key=="d") x+=10;
  if(e.key=="a") x-=10;
  if(e.key=="w") y-=10;
  if(e.key=="s") y+=10;
  p.style.left=x+"px";
  p.style.top=y+"px";
}
</script>

</body>
</html>
